<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskmaster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 32px;
        }
        
        #taskForm {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        
        input[type="text"] {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button[type="submit"] {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button[type="submit"]:hover {
            background: #5568d3;
        }
        
        button[type="submit"]:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        #taskList {
            list-style: none;
        }
        
        #taskList li {
            background: #f8f9fa;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s;
        }
        
        #taskList li:hover {
            transform: translateX(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        #taskList li.completed {
            opacity: 0.6;
        }
        
        #taskList li.completed .task-content {
            text-decoration: line-through;
        }
        
        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .task-content {
            flex: 1;
            min-width: 0;
        }
        
        .task-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        
        .task-description {
            font-size: 14px;
            color: #666;
        }
        
        .task-buttons {
            display: flex;
            gap: 8px;
        }
        
        .task-buttons button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-toggle {
            background: #4caf50;
            color: white;
        }
        
        .btn-toggle:hover {
            background: #45a049;
        }
        
        .btn-delete {
            background: #f44336;
            color: white;
        }
        
        .btn-delete:hover {
            background: #da190b;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Tasks</h1>

        <div id="errorMessage" class="error-message"></div>

        <form id="taskForm">
            <input type="text" id="title" placeholder="Title" required>
            <input type="text" id="description" placeholder="Description">
            <button type="submit">Add Task</button>
        </form>

        <ul id="taskList"></ul>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000/tasks';

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        async function loadTasks() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Failed to fetch");
                const tasks = await response.json();
                const list = document.getElementById("taskList");
                list.innerHTML = "";

                if (tasks.length === 0) {
                    list.innerHTML = '<div class="empty-state">No tasks yet. Add one above to get started!</div>';
                    return;
                }

                tasks.forEach(task => {
                    const item = document.createElement("li");
                    if (task.completed) {
                        item.classList.add('completed');
                    }

                    // Checkbox
                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.className = "task-checkbox";
                    checkbox.checked = task.completed;
                    checkbox.onchange = () => toggleCompleted(task.id, task);

                    // Task content
                    const content = document.createElement("div");
                    content.className = "task-content";
                    
                    const title = document.createElement("div");
                    title.className = "task-title";
                    title.textContent = task.title;
                    content.appendChild(title);

                    if (task.description) {
                        const description = document.createElement("div");
                        description.className = "task-description";
                        description.textContent = task.description;
                        content.appendChild(description);
                    }

                    // Buttons container
                    const buttons = document.createElement("div");
                    buttons.className = "task-buttons";

                    const deleteBtn = document.createElement("button");
                    deleteBtn.className = "btn-delete";
                    deleteBtn.textContent = "Delete";
                    deleteBtn.onclick = () => deleteTask(task.id);

                    buttons.appendChild(deleteBtn);

                    item.appendChild(checkbox);
                    item.appendChild(content);
                    item.appendChild(buttons);
                    list.appendChild(item);
                });
            } catch (err) {
                showError("Error loading tasks: " + err.message);
                console.error("Load error:", err);
            }
        }

        async function addTask(e) {
            e.preventDefault();
            const title = document.getElementById("title").value.trim();
            const description = document.getElementById("description").value.trim();

            if (!title) {
                showError("Title is required");
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        title, 
                        description: description || "" 
                    })
                });
                if (!response.ok) throw new Error("Could not add task");
                document.getElementById("taskForm").reset();
                await loadTasks();
            } catch (err) {
                showError("Error adding task: " + err.message);
                console.error("Add error:", err);
            }
        }

        async function deleteTask(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`, { 
                    method: "DELETE" 
                });
                if (!response.ok) throw new Error("Could not delete task");
                await loadTasks();
            } catch (err) {
                showError("Error deleting task: " + err.message);
                console.error("Delete error:", err);
            }
        }

        async function toggleCompleted(id, task) {
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        title: task.title,
                        description: task.description,
                        completed: !task.completed
                    })
                });
                if (!response.ok) throw new Error("Could not update task");
                await loadTasks();
            } catch (err) {
                showError("Error updating task: " + err.message);
                console.error("Toggle error:", err);
            }
        }

        document.getElementById("taskForm").addEventListener("submit", addTask);
        
        // Load tasks on page load
        loadTasks();
    </script>
</body>
</html>
